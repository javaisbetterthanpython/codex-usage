[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage-limits"
version = "0.1.0"
description = "CLI for Codex plan usage and rate limits, with session-log fallback and warning thresholds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "codex-usage contributors" }]
keywords = ["codex", "openai", "chatgpt", "usage", "rate-limit", "weekly-usage", "subscription", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
codex-usage = "codex_usage.cli:main"

[project.urls]
Homepage = "https://github.com/javaisbetterthanpython/codex-usage"
Issues = "https://github.com/javaisbetterthanpython/codex-usage/issues"

[tool.setuptools.packages.find]
where = ["src"]
